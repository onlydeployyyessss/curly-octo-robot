# Local development stack: Postgres + API + web (vite runs on host: npm run dev)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pc
      POSTGRES_PASSWORD: pc
      POSTGRES_DB: pc_mission
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
